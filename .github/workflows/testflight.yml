name: testflight

# Every push to main whose `ci` run passes ends up as a TestFlight build.
# Manual runs (Actions → testflight → Run workflow) are allowed on main, but only for a
# commit that already has a green `ci` run.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  upload:
    name: Archive, sign, upload
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Same image as ci. If it queues or misbehaves, use macos-26.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PROJECT: DanaisCalendar.xcodeproj
      SCHEME: DanaisCalendar
      TEAM_ID: 22M7WDXU43
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Build number = this workflow's run number: always increasing, never edited by hand.
      BUILD_NUMBER: ${{ github.run_number }}
      ARCHIVE: build/DanaisCalendar.xcarchive
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Require a green ci run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$SHA" --status success --json databaseId --jq 'length')
          if [ "$green" -eq 0 ]; then
            echo "::error::ci has not passed for $SHA; nothing is uploaded without green tests."
            exit 1
          fi

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::GitHub secret $name is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          dir="$RUNNER_TEMP/asc"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$ASC_KEY_P8" > "$dir/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$dir/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$dir/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          mkdir -p build/logs

      # Built without a signing identity: the runner has no certificates. The real
      # signature comes from Apple's cloud-managed distribution certificate at export.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            GIT_COMMIT="${SHA:0:7}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/archive.log | xcbeautify

      # An unsigned binary carries no entitlements, and the export keeps the entitlements
      # it finds in the binary. So seal them in with a temporary ad-hoc signature.
      - name: Seal entitlements into the archive
        run: |
          app="$ARCHIVE/Products/Applications/DanaisCalendar.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          echo "BUNDLE_ID=$bundle_id" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

          entitlements=build/archive-entitlements.plist
          cp App/DanaisCalendar.entitlements "$entitlements"
          /usr/libexec/PlistBuddy -c "Add :application-identifier string $TEAM_ID.$bundle_id" "$entitlements"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$entitlements"

          # Nested code first (none today, but frameworks or extensions may come).
          find "$app" -mindepth 2 \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -prune \
            -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "$entitlements" "$app"
          codesign -d --entitlements - "$app"

      - name: Export with cloud signing
        run: |
          set -o pipefail
          write_options() {
            cat > "$2" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          }
          write_options export build/ExportOptions.plist
          write_options upload build/UploadOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/logs/export.log

      - name: Check signature, entitlements and build number
        run: |
          ipa=$(ls build/export/*.ipa)
          rm -rf build/ipa && mkdir -p build/ipa
          unzip -q "$ipa" -d build/ipa
          app=$(ls -d build/ipa/Payload/*.app)

          codesign --verify --strict "$app"
          authority=$(codesign -dvv "$app" 2>&1 | grep -m1 '^Authority=' || true)
          case "$authority" in
            *"Apple Distribution"*|*"iPhone Distribution"*) echo "Signed for distribution: OK" ;;
            *) echo "::error::Not signed with a distribution certificate"; exit 1 ;;
          esac

          codesign -d --entitlements - --xml "$app" > build/final-entitlements.plist
          plutil -p build/final-entitlements.plist | tee build/logs/final-entitlements.txt
          failed=0
          # PlistBuddy, not plutil: plutil reads the dots in these keys as a key path.
          for key in com.apple.developer.icloud-container-identifiers \
                     com.apple.developer.ubiquity-container-identifiers \
                     com.apple.developer.icloud-services \
                     com.apple.security.application-groups; do
            want=$(/usr/libexec/PlistBuddy -c "Print :$key" App/DanaisCalendar.entitlements)
            got=$(/usr/libexec/PlistBuddy -c "Print :$key" build/final-entitlements.plist 2>/dev/null || echo missing)
            if [ "$want" = "$got" ]; then echo "$key: OK"; else echo "::error::$key is $got, expected $want"; failed=1; fi
          done
          if [ "$(plutil -extract get-task-allow raw -o - build/final-entitlements.plist 2>/dev/null)" = "true" ]; then
            echo "::error::get-task-allow is true (development signature)"; failed=1
          fi

          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          if [ "$build" != "$BUILD_NUMBER" ]; then echo "::error::CFBundleVersion is $build, expected $BUILD_NUMBER"; failed=1; fi
          echo "Version $APP_VERSION ($build), commit ${SHA:0:7}"
          exit $failed

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist build/UploadOptions.plist \
            -exportPath build/upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/logs/upload.log
          {
            echo "### TestFlight"
            echo "Uploaded **$APP_VERSION ($BUILD_NUMBER)** from commit \`${SHA:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for App Store Connect processing
        timeout-minutes: 30
        run: |
          swiftc -swift-version 5 -parse-as-library scripts/ci/asc-wait-for-build.swift -o build/asc-wait-for-build
          build/asc-wait-for-build "$BUNDLE_ID" "$APP_VERSION" "$BUILD_NUMBER" | tee build/logs/processing.log

      # Xcode's own export logs explain signing failures in detail. They name the team,
      # so they are kept only on failure and only for a few days.
      - name: Collect Xcode distribution logs
        if: failure()
        run: |
          mkdir -p build/distribution-logs
          {
            grep -ho '/[^" ]*\.xcdistributionlogs' build/logs/*.log 2>/dev/null
            find "${TMPDIR:-/tmp}" -maxdepth 2 -name '*.xcdistributionlogs' 2>/dev/null
          } | sort -u | while read -r bundle; do
            [ -d "$bundle" ] && cp -R "$bundle" build/distribution-logs/
          done
          ls build/distribution-logs
          true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs
          path: build/logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload distribution logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-logs
          path: build/distribution-logs
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
